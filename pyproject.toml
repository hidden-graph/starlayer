[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starlayer"
version = "0.1.0"
description = "Full StarLayer RDF 1.2 stack: graph, SPARQL, and SHACL support"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [{ name = "John Clements", email = "clements.john.j@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
    "requests>=2.28",
    "pyshacl>=0.40.1",
]
keywords = ["rdf", "rdf12", "sparql", "sparql12", "shacl", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
sqlalchemy = ["rdflib-sqlalchemy>=0.5", "setuptools<81"]
test = ["pytest>=8.0", "hypothesis>=6", "requests>=2"]

[project.urls]
Homepage = "https://github.com/hidden-graph/starlayer"
Repository = "https://github.com/hidden-graph/starlayer"
Issues = "https://github.com/hidden-graph/starlayer/issues"

[tool.setuptools.packages.find]
where = ["packages/graph", "packages/sparql", "packages/shacl"]
include = ["starlayergraph*", "starsparql*", "starshacl*"]

[tool.setuptools.package-data]
starlayergraph = ["py.typed"]
starsparql = ["ontology/*.ttl"]
starshacl = ["assets/*.ttl"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["*/tests/w3c_*/rdf-tests", "*/tests/**/fixtures"]

[tool.ruff.lint]
# Deliberately not enabling E501 (line-too-long): this codebase favors long,
# dense comments/docstrings that pack in context on purpose - see CLAUDE.md
# files throughout the repo. Formatting is left to `ruff format`, not the
# linter, and E501 isn't in Ruff's own default selection anyway.
select = [
    "E4", "E7", "E9",  # pycodestyle: imports, statements, syntax errors
    "F",               # pyflakes: unused imports/vars, undefined names, etc.
    "I",               # isort: import sorting
    "UP",              # pyupgrade: modernize to target-version syntax
    "B",               # flake8-bugbear: common bug-prone patterns
]

[tool.ruff.lint.per-file-ignores]
# E701/E702 (multiple statements per line): these parser files deliberately
# use column-aligned one-line `if ...: continue` filter chains and escape-
# dispatch tables - reviewed 2026-08-16, more readable as-is than reformatted.
"packages/graph/starlayergraph/graph/starlayer_graph.py" = ["E701", "E702"]
"packages/graph/starlayergraph/parsers/ntriples12.py" = ["E701", "E702"]
"packages/graph/starlayergraph/parsers/syntax.py" = ["E701", "E702"]
"packages/graph/starlayergraph/parsers/trig12.py" = ["E701", "E702"]
"packages/graph/starlayergraph/parsers/turtle_parser.py" = ["E701", "E702"]
# E402 (import not at top of file): standalone scripts/harnesses that need
# `sys.path.insert(...)` before importing - not installed as packages.
"*/benchmarks/*.py" = ["E402"]
"*/examples/*.py" = ["E402"]
"*/tests/w3c_*/*.py" = ["E402"]
