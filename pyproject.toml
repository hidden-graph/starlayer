[tool.ruff]
target-version = "py310"
extend-exclude = ["*/tests/w3c_*/rdf-tests", "*/tests/**/fixtures"]

[tool.ruff.lint]
# Deliberately not enabling E501 (line-too-long): this codebase favors long,
# dense comments/docstrings that pack in context on purpose - see CLAUDE.md
# files throughout the repo. Formatting is left to `ruff format`, not the
# linter, and E501 isn't in Ruff's own default selection anyway.
select = [
    "E4", "E7", "E9",  # pycodestyle: imports, statements, syntax errors
    "F",               # pyflakes: unused imports/vars, undefined names, etc.
    "I",               # isort: import sorting
    "UP",              # pyupgrade: modernize to target-version syntax
    "B",               # flake8-bugbear: common bug-prone patterns
]

[tool.ruff.lint.per-file-ignores]
# E701/E702 (multiple statements per line): these parser files deliberately
# use column-aligned one-line `if ...: continue` filter chains and escape-
# dispatch tables - reviewed 2026-08-16, more readable as-is than reformatted.
"packages/graph/starlayergraph/graph/starlayer_graph.py" = ["E701", "E702"]
"packages/graph/starlayergraph/parsers/ntriples12.py" = ["E701", "E702"]
"packages/graph/starlayergraph/parsers/syntax.py" = ["E701", "E702"]
"packages/graph/starlayergraph/parsers/trig12.py" = ["E701", "E702"]
"packages/graph/starlayergraph/parsers/turtle_parser.py" = ["E701", "E702"]
# E402 (import not at top of file): standalone scripts/harnesses that need
# `sys.path.insert(...)` before importing - not installed as packages.
"*/benchmarks/*.py" = ["E402"]
"*/examples/*.py" = ["E402"]
"*/tests/w3c_*/*.py" = ["E402"]
