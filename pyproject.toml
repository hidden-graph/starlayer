[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starlayer"
version = "0.1.0"
description = "Full StarLayer RDF 1.2 stack: graph, SPARQL, and SHACL support"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [{ name = "John Clements", email = "clements.john.j@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    # rdflib is NOT a core dependency: graphs, parsing, SPARQL query and update, SHACL validation and rules run on pyoxigraph.
    # It is the `rdflib` extra (from_rdflib / to_rdflib, the Manchester syntax, the SRL / salg / sqe tree machinery, SHACL UI
    # widget selection, and owlrl, which computes the RDFS / OWL 2 RL closures behind inference on an rdflib copy).
    # pyoxigraph is core: starlayer.shacl_engine and starlayer.graph.oxgraph import it at
    # module level. 0.5.13 is the minimum supported Oxigraph: older versions abort the
    # process on SPARQL `=` over rdf:dirLangString (oxigraph#1982), see
    # docs/upstream-issues/oxigraph-upstream-issues.md and graph/backends/_versions.py.
    "pyoxigraph>=0.5.13",
]
keywords = ["rdf", "rdf12", "sparql", "sparql12", "shacl", "knowledge-graph", "semantic-web", "linked-data", "turtle", "reification", "triple-terms", "rdf-star", "algebra"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
# Optional rdflib: from_rdflib / to_rdflib, Manchester syntax, SRL / salg / sqe trees, SHACL UI widget selection. Without it these
# raise an ImportError that names this extra. `pip install starlayer[rdflib]`.
rdflib = ["rdflib>=7.0"]
# owlrl computes the RDFS and OWL 2 RL closures behind infer() / entailment regimes; it runs on an rdflib copy of the graph, so
# the extra includes rdflib.
reasoning = ["owlrl>=6", "rdflib>=7.0"]
# The two engines StarLayerGraph.infer(entailment=ENTAILMENT["OWL-Direct"], engine=...) can
# dispatch to - see starlayer/graph/graph/owl_dl.py and owl_dl_rustdl.py.
# Neither is core: "hermit" also needs a real JVM on PATH that pip alone
# can't provide, and "rustdl" is a different, non-strictly-better tradeoff
# (no JVM, but not provably complete on full SROIQ) - both opt-in, symmetrically.
hermit = ["rdflib>=7.0", "owlready2>=0.51"]
rustdl = ["rdflib>=7.0", "rustdl>=0.4"]
# The tests import rdflib (an oracle and the optional-feature tests) and owlrl in many places.
test = ["pytest>=8.0", "hypothesis>=6", "rdflib>=7.0", "owlrl>=6"]
# Executes the guide notebooks (tests/notebooks, opt-in: pytest --notebooks).
notebooks = ["nbclient>=0.10", "nbformat>=5", "ipykernel>=6", "rdflib>=7.0", "owlrl>=6"]
# pytest-benchmark for benchmarks-graph/benchmarks-shacl's own test_bench_*.py
# regression guards (outside `testpaths`, so a bare `pytest` never collects
# them - see .github/workflows/benchmark.yml and each dir's own README).
benchmark = ["pytest-benchmark>=5.0"]

[project.urls]
Homepage = "https://github.com/hidden-graph/starlayer"
Repository = "https://github.com/hidden-graph/starlayer"
Issues = "https://github.com/hidden-graph/starlayer/issues"

# package-data below is the whole list of non-Python files that ship; without
# this, setuptools also adds anything a stale *.egg-info/SOURCES.txt lists.
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["packages/starlayer"]
include = ["starlayer*"]

[tool.setuptools.package-data]
# Only what the library reads at run time. Not shipped: starontology.trig (a
# generated copy of the .ttl files) and skos.rdf (build input). The code knowledge
# graph tooling lives in tools/kg, outside the package.
starlayer = ["py.typed", "starontology/*.ttl"]

[tool.pytest.ini_options]
testpaths = ["packages/starlayer/tests"]
# Lets tests import the build-time modules in scripts/ (build_meta_shapes.py) and the code-KG tooling in tools/kg (the `codekg` package) directly.
pythonpath = ["scripts", "tools/kg"]
markers = [
    "integration: tests requiring a running Fuseki/Oxigraph server - the 'full testing' tier.",
    "w3c_sparql12: W3C SPARQL 1.2 test suite cross-checks.",
    "store_matrix: the W3C conformance suites run through every store (in-process, on-disk and server-backed Oxigraph, Fuseki) - slow, opt-in: pytest --store-matrix (or STARLAYER_STORE_MATRIX=1, or -m store_matrix). See tests/conftest.py.",
    "srl_stratification: extended checks of SRL's stratification algorithm - opt-in: pytest --srl-stratification (or STARLAYER_SRL_STRATIFICATION=1, or -m srl_stratification). See tests/conftest.py.",
    "deferred: checks of committed data that CI runs anyway (code-KG tests that load codekg.trig, stored-file-matches-build tests) - opt-in: pytest --deferred (or STARLAYER_DEFERRED=1, or -m deferred). CI always runs them. See tests/conftest.py.",
    "graph: tests of the graph area (tests/graph); applied automatically from the directory, so `pytest -m graph` runs the area alone.",
    "shacl: tests of the SHACL area (tests/shacl); applied automatically from the directory.",
    "shacl_engine: tests of the native SHACL 1.2 engine (tests/shacl_engine); applied automatically from the directory.",
    "sparql: tests of the SPARQL area, including SRL and sqe (tests/sparql); applied automatically from the directory.",
    "starontology: tests of the bundled ontologies and shapes (tests/starontology); applied automatically from the directory.",
    "kg: tests of the code knowledge graph tooling (tools/kg), kept in tests/kg; applied automatically from the directory.",
    "sqe_coverage: the sqe query-coverage set (each SPARQL feature round-tripped through sqe and compared with plain rdflib) - opt-in: pytest --sqe-coverage (or STARLAYER_SQE_COVERAGE=1, or -m sqe_coverage). See tests/conftest.py.",
    "codekg_queries: the code-KG query library run against the real code knowledge graph - opt-in: pytest --codekg-queries (or STARLAYER_CODEKG_QUERIES=1, or -m codekg_queries). See tests/conftest.py.",
    "manchester_conformance: completeness suite for the Manchester Syntax parser and manch: tree (tests/starontology/manchester_conformance). Opt-in: pytest --manchester-conformance (or STARLAYER_MANCHESTER_CONFORMANCE=1, or -m manchester_conformance). Runs from committed OWL API goldens; no JVM needed. See tests/conftest.py.",
    "notebooks: executes every guide notebook in docs/guides and fails on any cell error except a missing optional package - opt-in: pytest --notebooks (or STARLAYER_NOTEBOOKS=1, or -m notebooks). Needs the `notebooks` extra. See tests/conftest.py and tests/notebooks.",
    "srl_conformance: completeness suite for the SRL (SPARQL Rules) parser, srl: tree and evaluator (tests/sparql/srl_conformance). Opt-in: pytest --srl-conformance (or STARLAYER_SRL_CONFORMANCE=1, or -m srl_conformance). About 10 minutes; no external tools. See tests/conftest.py.",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["*/tests/w3c_*/rdf-tests", "*/tests/**/fixtures"]

[tool.ruff.lint]
# Deliberately not enabling E501 (line-too-long): this codebase favors long,
# dense comments/docstrings that pack in context on purpose - see CLAUDE.md
# files throughout the repo. Formatting is left to `ruff format`, not the
# linter, and E501 isn't in Ruff's own default selection anyway.
select = [
    "E4", "E7", "E9",  # pycodestyle: imports, statements, syntax errors
    "F",               # pyflakes: unused imports/vars, undefined names, etc.
    "I",               # isort: import sorting
    "UP",              # pyupgrade: modernize to target-version syntax
    "B",               # flake8-bugbear: common bug-prone patterns
]

[tool.ruff.lint.isort]
# the code-KG tooling (tools/kg) is imported like the library: not first-party
known-third-party = ["codekg"]

[tool.ruff.lint.per-file-ignores]
# E701/E702 (multiple statements per line): these parser files deliberately
# use column-aligned one-line `if ...: continue` filter chains and escape-
# dispatch tables - reviewed 2026-08-16, more readable as-is than reformatted.
# Capability-check script: each check is a one-line closure handed straight to `trying()`, which calls it immediately, so
# defining them in a loop is safe (B023) and the compact `a; b` lines keep each check on one screen row (E702).
"packages/starlayer/benchmarks-graph/oxigraph_capability_checks.py" = ["E702", "B023"]
"packages/starlayer/starlayer/graph/graph/starlayer_graph.py" = ["E701", "E702"]
"packages/starlayer/starlayer/graph/parsers/ntriples12.py" = ["E701", "E702"]
"packages/starlayer/starlayer/graph/parsers/syntax.py" = ["E701", "E702"]
"packages/starlayer/starlayer/graph/parsers/trig12.py" = ["E701", "E702"]
"packages/starlayer/starlayer/graph/parsers/turtle_parser.py" = ["E701", "E702"]
# E402 (import not at top of file): standalone scripts/harnesses that need
# `sys.path.insert(...)` before importing - not installed as packages.
"*/benchmarks-*/*.py" = ["E402"]
"*/examples/*.py" = ["E402"]
"*/tests/w3c_*/*.py" = ["E402"]
