[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starlayer"
version = "0.1.0"
description = "Full StarLayer RDF 1.2 stack: graph, SPARQL, and SHACL support"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [{ name = "John Clements", email = "clements.john.j@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
    "requests>=2.28",
    # pySHACL is a core dependency, not test-only: starlayer.shacl needs it
    # unconditionally to function (it wraps pyshacl.validate() as its
    # validation engine) - see packages/starlayer/docs/shacl/compatibility.md.
    # Verified against pySHACL 0.40.0 specifically; workarounds for known
    # pySHACL bugs are defensive but correctness against other versions
    # hasn't been separately confirmed.
    "pyshacl>=0.40.1",
]
keywords = ["rdf", "rdf12", "sparql", "sparql12", "shacl", "pyshacl", "knowledge-graph", "semantic-web", "linked-data", "turtle", "reification", "triple-terms", "rdf-star", "algebra"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
# setuptools<81 pin: rdflib-sqlalchemy still imports pkg_resources at module
# load (setuptools>=81 removed it) - remove once rdflib-sqlalchemy drops the
# pkg_resources import upstream.
sqlalchemy = ["rdflib-sqlalchemy>=0.5", "setuptools<81"]
reasoning = ["owlrl>=6"]
# Oxigraph as an rdflib Store (oxrdflib's OxigraphStore, wrapping pyoxigraph),
# usable in rdf-1.2 native mode via StarLayerGraph(store=OxigraphStore(...),
# backend='rdf-1.2') - real triple terms + SPARQL 1.2, in-process, no HTTP.
# See starlayer/graph/backends/native_oxigraph.py. Opt-in, never a default.
oxigraph = ["oxrdflib>=0.4", "pyoxigraph>=0.5"]
# The two engines StarLayerGraph.infer(entailment=ENTAILMENT["OWL-Direct"], engine=...) can
# dispatch to - see starlayer/graph/graph/owl_dl.py and owl_dl_rustdl.py.
# Neither is core: "hermit" also needs a real JVM on PATH that pip alone
# can't provide, and "rustdl" is a different, non-strictly-better tradeoff
# (no JVM, but not provably complete on full SROIQ) - both opt-in, symmetrically.
hermit = ["owlready2>=0.51"]
rustdl = ["rustdl>=0.4"]
test = ["pytest>=8.0", "hypothesis>=6"]
# pytest-benchmark for benchmarks-graph/benchmarks-shacl's own test_bench_*.py
# regression guards (outside `testpaths`, so a bare `pytest` never collects
# them - see .github/workflows/benchmark.yml and each dir's own README).
benchmark = ["pytest-benchmark>=5.0"]

[project.urls]
Homepage = "https://github.com/hidden-graph/starlayer"
Repository = "https://github.com/hidden-graph/starlayer"
Issues = "https://github.com/hidden-graph/starlayer/issues"

[tool.setuptools.packages.find]
where = ["packages/starlayer"]
include = ["starlayer*"]

[tool.setuptools.package-data]
starlayer = ["py.typed", "shacl/assets/*.ttl", "starontology/*.trig", "codekg/*.ttl", "codekg/*.trig"]

[tool.pytest.ini_options]
testpaths = ["packages/starlayer/tests"]
markers = [
    "integration: tests requiring a running Fuseki/Oxigraph server or a real backend store (e.g. SQLite via rdflib-sqlalchemy) - the 'full testing' tier.",
    "w3c_sparql12: W3C SPARQL 1.2 test suite cross-checks.",
    "store_matrix: the W3C conformance suites run through every store (in-process, on-disk and server-backed Oxigraph, Fuseki) - slow, opt-in: pytest --store-matrix (or STARLAYER_STORE_MATRIX=1, or -m store_matrix). See tests/conftest.py.",
    "srl_stratification: extended checks of SRL's stratification algorithm - opt-in: pytest --srl-stratification (or STARLAYER_SRL_STRATIFICATION=1, or -m srl_stratification). See tests/conftest.py.",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["*/tests/w3c_*/rdf-tests", "*/tests/**/fixtures"]

[tool.ruff.lint]
# Deliberately not enabling E501 (line-too-long): this codebase favors long,
# dense comments/docstrings that pack in context on purpose - see CLAUDE.md
# files throughout the repo. Formatting is left to `ruff format`, not the
# linter, and E501 isn't in Ruff's own default selection anyway.
select = [
    "E4", "E7", "E9",  # pycodestyle: imports, statements, syntax errors
    "F",               # pyflakes: unused imports/vars, undefined names, etc.
    "I",               # isort: import sorting
    "UP",              # pyupgrade: modernize to target-version syntax
    "B",               # flake8-bugbear: common bug-prone patterns
]

[tool.ruff.lint.per-file-ignores]
# E701/E702 (multiple statements per line): these parser files deliberately
# use column-aligned one-line `if ...: continue` filter chains and escape-
# dispatch tables - reviewed 2026-08-16, more readable as-is than reformatted.
"packages/starlayer/starlayer/graph/graph/starlayer_graph.py" = ["E701", "E702"]
"packages/starlayer/starlayer/graph/parsers/ntriples12.py" = ["E701", "E702"]
"packages/starlayer/starlayer/graph/parsers/syntax.py" = ["E701", "E702"]
"packages/starlayer/starlayer/graph/parsers/trig12.py" = ["E701", "E702"]
"packages/starlayer/starlayer/graph/parsers/turtle_parser.py" = ["E701", "E702"]
# E402 (import not at top of file): standalone scripts/harnesses that need
# `sys.path.insert(...)` before importing - not installed as packages.
"*/benchmarks-*/*.py" = ["E402"]
"*/examples/*.py" = ["E402"]
"*/tests/w3c_*/*.py" = ["E402"]
