name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Repo-root pyproject.toml's [tool.ruff] covers the whole package at
      # once - one lint policy for the monorepo, not per-package config.
      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check packages/

  # Generated files are committed: the generated starontology .ttl files and
  # starontology.trig, the code knowledge graph (codekg.trig), and the generated
  # API docs. This runs every build step and fails if any committed output no
  # longer matches (e.g. after a code change, a pySHACL upgrade, or an edited
  # .ttl). Fix with `python scripts/build.py` and commit the result.
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install starlayer
        run: pip install -e ".[test]"

      - name: Check generated files are current
        run: python scripts/build.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    # Oxigraph's default image CMD is already `serve --location /data --bind
    # 0.0.0.0:7878` (confirmed via `docker inspect`), so no command override
    # is needed here - GitHub Actions service containers can't pass one
    # anyway (services support image/ports/env/volumes/options, not CMD
    # args). Fuseki is *not* wired in here: its image needs dataset-creation
    # args at startup with no equivalent env-var config, which service
    # containers can't supply - full-Fuseki coverage stays manual-only for
    # now (packages/starlayer/tests/graph/integration/test_fuseki_backend.py's
    # own docstring has the docker run command). Every Fuseki-only test class
    # already self-skips when Fuseki isn't reachable, so running the whole
    # integration marker here with only Oxigraph up is safe - it exercises
    # the Oxigraph and SQLite coverage and skips the rest.
    services:
      oxigraph:
        image: ghcr.io/oxigraph/oxigraph
        ports:
          - 7878:7878

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # One package now (starlayer, source at packages/starlayer, but the
      # canonical pyproject.toml lives at the repo root since the 2026-10-12
      # consolidation - install from "." here, not "packages/starlayer").
      - name: Install starlayer
        run: |
          pip install -e ".[sqlalchemy,test]"

      - name: Wait for Oxigraph
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:7878/ >/dev/null && exit 0
            sleep 1
          done
          echo "Oxigraph did not become ready in time" >&2
          exit 1

      - name: Unit and W3C tests
        working-directory: packages/starlayer
        run: pytest tests/ -m "not integration" -v

      - name: Integration tests (Oxigraph + SQLite; Fuseki-only tests self-skip)
        working-directory: packages/starlayer
        run: pytest tests/ -m "integration" -v
