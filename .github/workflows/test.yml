name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # The repo-root pyproject.toml's [tool.ruff] is the one lint policy for every package.
      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check packages/ tools/

  # Some generated files are committed: four starontology .ttl files and the generated docs. This job fails if any no longer
  # matches what its build produces (an edited source, an upgraded dependency or a changed generator). The code knowledge graph
  # is not committed; the API docs are checked against a graph built from the source here (about 30 seconds). Fix with
  # `python scripts/build.py` and commit the result.
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install starlayer
        run: pip install -e packages/starlayer-reasoning -e "packages/starlayer[test]"

      - name: Check generated files are current
        run: python scripts/build.py --check

  # One Python version only: this is an alpha project, and a four-version matrix
  # (3.10-3.13) made every run about four times as long. The packages still
  # declare >=3.10; to check another version, run the suite locally or
  # temporarily widen this list.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install starlayer
        run: |
          pip install -e packages/starlayer-reasoning -e "packages/starlayer[test]"

      # No test carries the `integration` marker any more (the Fuseki ones were removed), so there is no separate integration step:
      # `pytest -m integration` would collect nothing and exit 5. The step and its Oxigraph service container went with them.
      # The `deferred` tests (checks of committed data: the code-KG tests, the stored-file-matches-build tests) run in
      # committed-data.yml, only when something they depend on changes and on every promotion to main.
      - name: Unit and W3C tests
        working-directory: packages/starlayer
        run: pytest tests/ -m "not integration" -v

      - name: starlayer-reasoning tests
        working-directory: packages/starlayer-reasoning
        run: pytest tests/ -v
