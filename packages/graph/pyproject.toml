[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph"
version = "0.1.0"
description = "RDF 1.2 extension for rdflib — triple terms, reification, annotation folding, and SPARQL 1.2"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [{ name = "John Clements", email = "clements.john.j@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
    "requests>=2.28",
    # Not published to PyPI. Install the sibling packages first:
    #   pip install -e ../sparql -e ../shacl
    # The repo-level core install is the `graph` package, while the Python
    # import remains `starlayergraph` for compatibility with the codebase.
    "sparql",
    # StarLayerGraph.derive() goes through starshacl (never bare pyshacl)
    # for anything shape-related, since a template shape or the data itself
    # may be genuine RDF 1.2 content (triple terms) that only starshacl
    # understands - an intentional circular dependency with packages/shacl,
    # the same shape as the sparql one above (shacl already depends on
    # graph; see starshacl/subgraph_extraction.py).
    "shacl",
    # Raw ontology/shapes .ttl data (manchester-ast-ontology.ttl/skos-*.ttl)
    # - no dependency back on graph/sparql/shacl, so this one is a plain,
    # one-directional edge, not part of any cycle.
    "ontology",
]
keywords = ["rdf", "rdf12", "knowledge-graph", "semantic-web", "linked-data", "sparql", "turtle", "reification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
# setuptools<81 pin: rdflib-sqlalchemy still imports pkg_resources at module load
# (setuptools>=81 removed it), so on a fresh install with a current setuptools
# this extra fails outright with "ModuleNotFoundError: No module named 'pkg_resources'".
# Remove once rdflib-sqlalchemy drops the pkg_resources import upstream.
sqlalchemy = ["rdflib-sqlalchemy>=0.5", "setuptools<81"]
reasoning = ["owlrl>=6"]
# The two engines StarLayerGraph.infer(profile="owl-dl", engine=...) can
# dispatch to - see starlayergraph/graph/owl_dl.py and owl_dl_rustdl.py.
# Neither is core: "hermit" also needs a real JVM on PATH that pip alone
# can't provide, and "rustdl" is a different, non-strictly-better tradeoff
# (no JVM, but not provably complete on full SROIQ) - so both are opt-in,
# symmetrically, rather than one being special.
hermit = ["owlready2>=0.51"]
rustdl = ["rustdl>=0.4"]
test = ["pytest>=7", "hypothesis>=6", "pyshacl>=0.25"]

[project.urls]
Homepage = "https://github.com/hidden-graph/starlayer/tree/main/packages/graph"
Repository = "https://github.com/hidden-graph/starlayer"
Issues = "https://github.com/hidden-graph/starlayer/issues"

[tool.setuptools.packages.find]
include = ["starlayergraph*"]

[tool.setuptools.package-data]
starlayergraph = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring a running Fuseki/Oxigraph server or a real backend store (e.g. SQLite via rdflib-sqlalchemy) - the 'full testing' tier",
    "w3c_sparql12: W3C SPARQL 1.2 test suite cross-checks (tests/w3c_sparql12/test_algebra_regenerated_queries.py) - shared marker name with the starsparql package's own W3C suite",
]
