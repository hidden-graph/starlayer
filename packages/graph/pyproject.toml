[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starlayergraph"
version = "0.1.0"
description = "RDF 1.2 extension for rdflib — triple terms, reification, annotation folding, and SPARQL 1.2"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "John Clements", email = "clements.john.j@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
    "requests>=2.28",
    # Not published to PyPI. Install the sibling package first:
    #   pip install -e ../sparql
    # starsparql declares a matching dependency back on this package -
    # intentional two-way dependency, starsparql is this project's
    # own SPARQL 1.2 engine layer, not an independent generic library.
    "starsparql",
]
keywords = ["rdf", "rdf12", "knowledge-graph", "semantic-web", "linked-data", "sparql", "turtle", "reification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
# setuptools<81 pin: rdflib-sqlalchemy still imports pkg_resources at module load
# (setuptools>=81 removed it), so on a fresh install with a current setuptools
# this extra fails outright with "ModuleNotFoundError: No module named 'pkg_resources'".
# Remove once rdflib-sqlalchemy drops the pkg_resources import upstream.
sqlalchemy = ["rdflib-sqlalchemy>=0.5", "setuptools<81"]
test = ["pytest>=7", "hypothesis>=6"]

[project.urls]
Homepage = "https://github.com/hidden-graph/starlayer/tree/main/packages/graph"
Repository = "https://github.com/hidden-graph/starlayer"
Issues = "https://github.com/hidden-graph/starlayer/issues"

[tool.setuptools.packages.find]
include = ["starlayergraph*"]

[tool.setuptools.package-data]
starlayergraph = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring a running Fuseki/Oxigraph server or a real backend store (e.g. SQLite via rdflib-sqlalchemy) - the 'full testing' tier",
]
