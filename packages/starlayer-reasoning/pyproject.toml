[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starlayer-reasoning"
version = "0.2.0"
description = "OWL reasoning for StarLayer: OWL 2 RL (owlrl) and OWL 2 DL (HermiT, rustdl) behind StarLayerGraph.infer()"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "John Clements", email = "clements.john.j@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    # Needs the core release that has starlayer.errors (ExecutionError kinds "timeout", "inconsistent", "inference"): 0.2.0.
    "starlayer[rdflib]>=0.2.0",
    "owlrl>=6",
]
keywords = ["rdf", "owl", "owl2-rl", "reasoning", "entailment", "rdflib", "starlayer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
# The OWL-DL engines behind infer(entailment=ENTAILMENT["OWL-Direct"], engine=...). "hermit" also needs a JVM on PATH; "rustdl" has no
# JVM but is not provably complete.
hermit = ["owlready2>=0.51"]
rustdl = ["rustdl>=0.4"]
test = ["pytest>=8.0", "hypothesis>=6"]

[project.urls]
Homepage = "https://github.com/hidden-graph/starlayer"
Repository = "https://github.com/hidden-graph/starlayer"
Issues = "https://github.com/hidden-graph/starlayer/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["starlayer_reasoning*"]
