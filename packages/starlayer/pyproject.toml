[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starlayer"
version = "0.1.0"
description = "Full StarLayer RDF 1.2 stack: graph, SPARQL, and SHACL support"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "John Clements", email = "clements.john.j@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    # pyoxigraph is the whole engine: graphs, parsing, SPARQL query and update, SHACL validation and rules. 0.5.13 is the minimum
    # supported Oxigraph: older versions abort the process on SPARQL `=` over rdf:dirLangString (oxigraph#1982), see
    # docs/upstream-issues/oxigraph-upstream-issues.md and graph/_versions.py.
    "pyoxigraph>=0.5.13",
]
keywords = ["rdf", "rdf12", "sparql", "sparql12", "shacl", "knowledge-graph", "semantic-web", "linked-data", "turtle", "reification", "triple-terms", "rdf-star", "algebra"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
# rdflib interchange (from_rdflib / to_rdflib); rdflib is imported only when a conversion runs. 7.0 to 7.2 have no Dataset.default_graph.
rdflib = ["rdflib>=7.0"]
# The OWL regimes of infer() live in the starlayer-reasoning package, which this project's tests also use as an oracle.
reasoning = ["starlayer[rdflib]", "starlayer-reasoning"]
test = ["pytest>=8.0", "hypothesis>=6", "rdflib>=7.0", "starlayer-reasoning"]
# Executes the guide notebooks (tests/notebooks, opt-in: pytest --notebooks).
notebooks = ["nbclient>=0.10", "nbformat>=5", "ipykernel>=6", "rdflib>=7.0", "starlayer-reasoning"]
# pytest-benchmark for the benchmarks/graph regression guard (outside `testpaths`; see .github/workflows/benchmark.yml).
benchmark = ["pytest-benchmark>=5.0"]

[project.urls]
Homepage = "https://github.com/hidden-graph/starlayer"
Repository = "https://github.com/hidden-graph/starlayer"
Issues = "https://github.com/hidden-graph/starlayer/issues"

# package-data below is the whole list of non-Python files that ship; without
# this, setuptools also adds anything a stale *.egg-info/SOURCES.txt lists.
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["starlayer*"]

[tool.setuptools.package-data]
# Only what the library reads at run time: the profiles document and the ontology and shapes files in the vocabulary folders. Not
# shipped: skos/skos.rdf (build input) and starontology/_sources (what the generated files are built from). The code knowledge
# graph tooling lives in tools/kg, outside the package.
starlayer = ["py.typed", "starontology/starlayer-profiles.ttl", "starontology/*/*.ttl"]

[tool.setuptools.exclude-package-data]
starlayer = ["starontology/_sources/*", "starontology/_sources/*/*"]
