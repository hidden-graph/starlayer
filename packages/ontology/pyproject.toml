[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology"
version = "0.1.0"
description = "Raw ontology/SHACL-shapes .ttl files shared by the StarLayer stack (manch:, skos:, salg:)"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [
    { name = "John Clements", email = "clements.john.j@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
]
keywords = ["rdf", "rdf12", "shacl", "ontology", "owl", "skos", "manchester-syntax", "sparql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/hidden-graph/starlayer/tree/main/packages/ontology"
Repository = "https://github.com/hidden-graph/starlayer"
Issues = "https://github.com/hidden-graph/starlayer/issues"

[tool.setuptools.packages.find]
include = ["starontology*"]

[tool.setuptools.package-data]
starontology = ["py.typed", "*.ttl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
