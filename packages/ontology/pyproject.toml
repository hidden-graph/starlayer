[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology"
version = "0.1.0"
description = "Ontology/SHACL-shapes .ttl files (manch:, skos:, salg:, srl:), loaded as StarLayerGraph instances - plus, for vocabularies that are fundamentally about editing ontologies (manch: today), the parse/serialize/validate logic for managing them as syntax trees"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [
    { name = "John Clements", email = "clements.john.j@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
    # Every loader returns a StarLayerGraph, not a plain rdflib.Graph - a
    # deliberate 2026-10-02 decision accepting this dependency (this package
    # previously had none on any consuming package, graph included) for API
    # consistency with the rest of the stack. Also needed for the
    # "shacl_meta" registry entry, which wraps starlayer.shacl's own
    # build_meta_shapes_graph(). Neither starlayer.graph nor starlayer.shacl
    # has any dependency back on this package, so this stays a clean DAG,
    # not a cycle - see starontology/__init__.py's own "Dependency note".
    "starlayer",
]
keywords = ["rdf", "rdf12", "shacl", "ontology", "owl", "skos", "manchester-syntax", "sparql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/hidden-graph/starlayer/tree/main/packages/ontology"
Repository = "https://github.com/hidden-graph/starlayer"
Issues = "https://github.com/hidden-graph/starlayer/issues"

[tool.setuptools.packages.find]
include = ["starontology*"]

[tool.setuptools.package-data]
starontology = ["py.typed", "*.ttl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
