[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparql"
version = "0.1.0"
description = "Translate SPARQL 1.2 queries into and out of an RDF representation of their algebra"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [{ name = "John Clements", email = "clements.john.j@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
    # Not published to PyPI. Install the sibling packages first:
    #   pip install -e ../graph -e ../shacl -e ../ontology
    "graph",
    # sparql_shapes.py::validate() goes through starshacl (never bare
    # pyshacl) for the same reason StarLayerGraph.derive() does: a `salg:`
    # data graph being validated may carry genuine RDF 1.2 content (real
    # TRIPLE()/<<( )>> query syntax), which only starshacl understands
    # correctly. This closes a 3-way dependency cycle with `graph` (which
    # already depends on both `sparql` and `shacl`) - safe the same way the
    # existing 2-way cycles already are: every actual `import starshacl`/
    # `import starsparql`/`import starlayergraph` across all three packages
    # stays lazy (inside functions, never at module top level).
    "shacl",
    # Raw ontology/shapes .ttl data (salg-ontology.ttl/sparql_shapes.ttl) -
    # no dependency back on graph/sparql/shacl, so this one is a plain,
    # one-directional edge, not part of any cycle.
    "ontology",
]
keywords = ["rdf", "rdf12", "sparql", "sparql12", "knowledge-graph", "semantic-web", "algebra"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6", "pyshacl>=0.25", "requests>=2"]

[project.urls]
Homepage = "https://github.com/hidden-graph/starlayer/tree/main/packages/sparql"
Repository = "https://github.com/hidden-graph/starlayer"
Issues = "https://github.com/hidden-graph/starlayer/issues"

[tool.setuptools.packages.find]
include = ["starsparql*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "w3c_sparql12: W3C SPARQL 1.2 test suite (tests/test_w3c_sparql12.py) - run download_w3c_sparql12_tests.py first",
]
